# ------------------------------------------------------------------
# D.UNI Probe v1.1 -> STM32 (OpenOCD, VS Code Cortex-Debug, STM32CubeIDE)
# ------------------------------------------------------------------
adapter driver cmsis-dap
cmsis-dap vid_pid 0x2e8a 0x000c
transport select swd
adapter speed 4000

# Для клонів STM32F103 (CKS32, APM32, GD32) розкоментуйте:
# set CPUTAPID 0

# ВАШ ЧИП - змініть рядок під свою серію:
#   stm32c0x stm32f0x stm32f1x stm32f2x stm32f3x stm32f4x stm32f7x
#   stm32g0x stm32g4x stm32h7x stm32l0 stm32l1 stm32l4x stm32l5x
#   stm32u5x stm32wbx stm32wlx
source [find target/stm32f1x.cfg]

# --- Скидання ---
# За замовчуванням: програмне скидання (SYSRESETREQ), достатньо SWCLK+SWDIO+GND.
# Якщо підключено NRST цілі до GP1 (J1-10 / J2-6) і потрібен
# "Connect under reset" (SWD-піни вимкнені прошивкою, сон, Stop-режим) - розкоментуйте:
# reset_config srst_only srst_nogate connect_assert_srst
